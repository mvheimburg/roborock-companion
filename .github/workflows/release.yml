name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Read version
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; open(os.environ['GITHUB_ENV'],'a').write('VERSION='+v+'\n')"
      - name: Publish missing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          (cd custom_components/roborock_companion && zip -r "$GITHUB_WORKSPACE/roborock_companion.zip" . -x '__pycache__/*' '*.pyc')
          gh release create "v$VERSION" roborock_companion.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
